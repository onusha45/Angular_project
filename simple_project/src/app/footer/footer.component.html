
<div *ngIf="isVisible">
    <table>
        <tr>
            <th>Sno</th>
            <th>Course Name</th>
            <th>Course Duration</th>
            <th>Course Price</th>
            <th>Status</th>
           
            
        </tr>
        <tr *ngFor="let course of courseList;let Sno =index">
            <td>{{Sno+1}}</td>
            <td>{{course.CourseName}}</td>
            <td>{{course.CourseDuration}}</td>
            <td>{{course.Price}}</td>
            <td>
                <span *ngIf="course.status">Active</span>
                <span *ngIf="!course.status">Deactive</span>
                </td>

        </tr>
    </table>
    </div>
<div  class="d-grid gap-2 d-md-block">
    <button class="btn btn-primary" type="button" (click)="enableDisable()">Show&Hide</button>
  
  </div>
